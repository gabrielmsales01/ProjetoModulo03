<svg width="800" viewBox="0 0 680 760" xmlns="http://www.w3.org/2000/svg" role="img" style="background:#fff;font-family:Arial,sans-serif">
  <title>Fluxo Make – Recuperação de Falhas no Banco de Dados</title>
  <desc>Diagrama do fluxo automatizado no Make para detectar e recuperar falhas de conexão com banco de dados</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#E24B4A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="340" y="32" text-anchor="middle" font-size="15" font-weight="600" fill="#222">Fluxo Make – Recuperação de falhas no banco de dados</text>

  <!-- STEP 1: Agendador -->
  <rect x="230" y="52" width="220" height="56" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="340" y="76" text-anchor="middle" font-size="14" font-weight="600" fill="#444441" dominant-baseline="central">⏱ Agendador (Schedule)</text>
  <text x="340" y="96" text-anchor="middle" font-size="12" fill="#5F5E5A" dominant-baseline="central">Dispara a cada 5 minutos</text>

  <line x1="340" y1="108" x2="340" y2="140" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- STEP 2: HTTP Request -->
  <rect x="210" y="140" width="260" height="56" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text x="340" y="164" text-anchor="middle" font-size="14" font-weight="600" fill="#0C447C" dominant-baseline="central">🌐 HTTP Request</text>
  <text x="340" y="184" text-anchor="middle" font-size="12" fill="#185FA5" dominant-baseline="central">Testa conexão com o banco de dados</text>

  <line x1="340" y1="196" x2="340" y2="228" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- STEP 3: Router -->
  <rect x="250" y="228" width="180" height="50" rx="25" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="258" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489" dominant-baseline="central">⇄ Router</text>

  <!-- Branch labels -->
  <text x="168" y="310" text-anchor="middle" font-size="12" fill="#0F6E56" font-weight="600">✅ Sucesso</text>
  <text x="512" y="310" text-anchor="middle" font-size="12" fill="#A32D2D" font-weight="600">❌ Falha</text>

  <path d="M272 278 L168 318" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <path d="M408 278 L512 318" fill="none" stroke="#E24B4A" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <!-- SUCCESS -->
  <rect x="78" y="318" width="180" height="56" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="168" y="342" text-anchor="middle" font-size="14" font-weight="600" fill="#085041" dominant-baseline="central">📊 Google Sheets</text>
  <text x="168" y="362" text-anchor="middle" font-size="12" fill="#0F6E56" dominant-baseline="central">Registra log de sucesso</text>

  <!-- FAILURE -->
  <rect x="422" y="318" width="180" height="56" rx="10" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.5"/>
  <text x="512" y="342" text-anchor="middle" font-size="14" font-weight="600" fill="#501313" dominant-baseline="central">📧 E-mail de Alerta</text>
  <text x="512" y="362" text-anchor="middle" font-size="12" fill="#791F1F" dominant-baseline="central">Notifica a equipe técnica</text>

  <line x1="512" y1="374" x2="512" y2="408" stroke="#E24B4A" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <!-- SLEEP -->
  <rect x="422" y="408" width="180" height="50" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text x="512" y="430" text-anchor="middle" font-size="14" font-weight="600" fill="#412402" dominant-baseline="central">⏳ Sleep (30s)</text>
  <text x="512" y="448" text-anchor="middle" font-size="12" fill="#633806" dominant-baseline="central">Aguarda antes de reconectar</text>

  <line x1="512" y1="458" x2="512" y2="492" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- RETRY -->
  <rect x="402" y="492" width="220" height="56" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text x="512" y="516" text-anchor="middle" font-size="14" font-weight="600" fill="#0C447C" dominant-baseline="central">🔄 Reconexão (HTTP)</text>
  <text x="512" y="536" text-anchor="middle" font-size="12" fill="#185FA5" dominant-baseline="central">Segunda tentativa de conexão</text>

  <line x1="512" y1="548" x2="512" y2="582" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SECOND ROUTER -->
  <rect x="422" y="582" width="180" height="50" rx="25" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="512" y="612" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489" dominant-baseline="central">⇄ Router</text>

  <text x="432" y="665" text-anchor="middle" font-size="12" fill="#0F6E56" font-weight="600">✅ Reconectou</text>
  <text x="600" y="665" text-anchor="middle" font-size="12" fill="#A32D2D" font-weight="600">❌ Falhou</text>

  <path d="M452 632 L432 675" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <path d="M572 632 L600 675" fill="none" stroke="#E24B4A" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <!-- Log reconexão -->
  <rect x="358" y="675" width="148" height="52" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="432" y="697" text-anchor="middle" font-size="14" font-weight="600" fill="#085041" dominant-baseline="central">📊 Log</text>
  <text x="432" y="715" text-anchor="middle" font-size="12" fill="#0F6E56" dominant-baseline="central">Registra recuperação</text>

  <!-- Escalonamento -->
  <rect x="530" y="675" width="130" height="52" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
  <text x="595" y="693" text-anchor="middle" font-size="13" font-weight="600" fill="#4A1B0C" dominant-baseline="central">🚨 Escalonamento</text>
  <text x="595" y="712" text-anchor="middle" font-size="11" fill="#712B13" dominant-baseline="central">E-mail ao responsável</text>

  <!-- Legend -->
  <rect x="40" y="680" width="12" height="12" rx="3" fill="#1D9E75"/>
  <text x="58" y="691" font-size="11" fill="#444">Fluxo de sucesso</text>
  <rect x="40" y="700" width="12" height="12" rx="3" fill="#E24B4A"/>
  <text x="58" y="711" font-size="11" fill="#444">Fluxo de falha</text>

  <!-- Footer -->
  <text x="340" y="748" text-anchor="middle" font-size="11" fill="#888">Projeto Módulo 3 – Low Code/No Code | Plataforma: Make | Prof. Kadidja Valéria | 11/05/2026</text>
</svg>
